
name: Deploy FastAPI to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy application
        run: |
          cd /opt/fastapi-hello
          git pull --ff-only origin main
          docker build -t fastapi-hello .
          docker service update --force --image fastapi-hello:latest fastapi-hello
